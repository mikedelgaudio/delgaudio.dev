    <script>
      // Prevent a flash of the wrong theme: stored choice, else the system setting
      (function () {
        var t = null;
        try {
          t = localStorage.getItem('theme');
        } catch (e) {}
        if (t !== 'paper' && t !== 'night') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'night'
            : 'paper';
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
